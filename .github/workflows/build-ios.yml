name: Build BlueWake iOS

on:
  workflow_dispatch: # Allows you to manually trigger the build from the Actions tab

jobs:
  build:
    runs-on: macos-latest # Dynamically selects GitHub's newest active M-series macOS runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2 # Fixed version to resolve Node 20 deprecation warnings

      - name: Set up Homebrew Dependencies
        run: |
          brew install cmake ninja rust llvm lld

      - name: Download Prepared Disc Image
        run: |
          # Pulls the full uncut asset from your specific repository fork
          curl -L -o "WindWaker.iso" "https://github.com/x-frontier/bluewaket/releases/download/v0.8.0/Legend.of.Zelda.The.-.The.Wind.Waker.USA.iso"

      - name: Execute BlueWake Compiler
        run: |
          chmod +x scripts/builder/build.sh
          # Executes the internal compilation engine using your cloud-downloaded ISO
          ./scripts/builder/build.sh "WindWaker.iso" --ipa build/BlueWake.ipa

      - name: Upload Finished IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueWake-iOS-Unsigned
          path: build/BlueWake.ipa
